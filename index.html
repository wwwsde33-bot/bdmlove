<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밥똥메 - 최종 통합 계산기</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #0c0e10;
            --card-bg: #141619;
            --nav-bg: #141619;
            --text-main: #e0e6ed;
            --text-sub: #94a3b8;
            --accent-color: #00d2ff;
            --border-color: #2d343f;
            --input-bg: #0c0e10;
            --stat-bg: #1e2228;
            --lang-btn-bg: #212529;
            --lang-btn-active: #ffffff;
            --lang-text-active: #000000;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between; /* 양 끝 정렬로 변경 */
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left { display: flex; align-items: center; gap: 20px; }
        .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; color: #fff; white-space: nowrap; }

        .nav-right { display: flex; align-items: center; gap: 12px; } /* 링크와 버튼 사이 간격 */

        /* 뉴비 가이드 링크 스타일 */
        .guide-link {
            color: var(--text-main);
            text-decoration: none;
            background-color: var(--lang-btn-bg);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .guide-link:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .lang-selector { display: flex; gap: 5px; }
        .lang-btn {
            background-color: var(--lang-btn-bg);
            color: var(--text-sub);
            border: 1px solid transparent;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active { background-color: var(--lang-btn-active); color: var(--lang-text-active); font-weight: 700; }

        .main-content { padding: 30px 20px; width: 100%; max-width: 1100px; box-sizing: border-box; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border-color); flex: 1; min-width: 360px; box-sizing: border-box; }
        
        h2 { margin: 0 0 20px 0; font-size: 1.3rem; color: #fff; }
        label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.9rem; }
        input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; text-align: center; font-weight: 700; box-sizing: border-box; }

        .check-group { display: flex; gap: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; }
        .check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; color: var(--text-main); }
        .check-item input { width: auto; cursor: pointer; }

        .stat-section { margin-top: 15px; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        .stat-header { 
            background: #1e2228; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            font-weight: 700; font-size: 0.95rem; transition: background 0.2s;
        }
        .stat-header:hover { background: #252a32; }
        .stat-content { display: none; padding: 15px; background: #141619; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-content.active { display: grid; }
        
        .stat-item { display: flex; flex-direction: column; }
        .stat-item label { font-size: 0.75rem; margin-bottom: 4px; color: var(--text-sub); }
        .stat-item input { padding: 8px; font-size: 0.9rem; }

        .stopwatch-container { margin: 20px 0; padding: 15px; background: var(--input-bg); border-radius: 12px; text-align: center; border: 1px solid var(--border-color); }
        #stopwatchDisplay { font-size: 1.8rem; font-family: monospace; color: var(--accent-color); display: block; margin-bottom: 10px; font-weight: bold; }
        .stopwatch-btns { display: flex; gap: 5px; }
        .stopwatch-btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        
        .result-box { margin-top: 15px; padding: 20px; background: var(--input-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .display-val { font-size: 2.2rem; font-weight: 900; color: var(--accent-color); }
        .calc-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #0099ff, #00d2ff); color: #fff; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .sub-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; color: var(--text-sub); align-items: center; }
        .sub-val { color: #fff; font-weight: 700; }
        .highlight { color: var(--accent-color); }
        
        .recommend-box { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo">
                <span>💩</span> <span data-i18n="nav_title">밥똥메 계산기</span>
            </div>
        </div>
        
        <div class="nav-right">
            <a href="sub/" class="guide-link" data-i18n="nav_guide">뉴비 가이드</a>
            
            <div class="lang-selector">
                <button class="lang-btn active" onclick="changeLanguage('ko')" data-lang="ko">한국어</button>
                <button class="lang-btn" onclick="changeLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="changeLanguage('zh')" data-lang="zh">简体</button>
                <button class="lang-btn" onclick="changeLanguage('tw')" data-lang="tw">繁體</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="card">
                <h2 data-i18n="card1_title">환생 & 스탯 계산기</h2>
                <label data-i18n="label_rebirth_lv">환생 레벨 포인트 확인 (100~300)</label>
                <input type="number" id="pointLvInput" placeholder="Lv" oninput="calPoint()">
                <div id="pointDisplay" style="text-align:right; margin: 8px 0; color:var(--accent-color); font-weight:bold; font-size:1.1rem;">0 P</div>

                <div class="stopwatch-container">
                    <span id="stopwatchDisplay">00:00:00</span>
                    <div class="stopwatch-btns">
                        <button style="background:#22c55e" onclick="startTimer()" data-i18n="btn_start">시작</button>
                        <button style="background:#ef4444" onclick="stopTimer()" data-i18n="btn_stop">정지</button>
                        <button style="background:#64748b" onclick="resetTimer()" data-i18n="btn_reset">리셋</button>
                        <button style="background:var(--accent-color); color:#000" onclick="applyTimeToCalc()" data-i18n="btn_apply">반영</button>
                    </div>
                </div>

                <div class="stat-section">
                    <div class="stat-header" onclick="toggleStat('stat1')">
                        <span data-i18n="stat_group_1">1차 스탯 (펼치기)</span>
                        <span id="stat1-icon">▼</span>
                    </div>
                    <div id="stat1" class="stat-content">
                        <div class="stat-item"><label data-i18n="stat_dmg">데미지</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_exp">추가경험치</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_crit">크리티컬</label><input type="number" class="stat-in" data-type="normal" max="100" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_meso">메소획득</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_drop">아이템드롭</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_speed">자동공속</label><input type="number" class="stat-in" data-type="normal" max="150" value="0"></div>
                    </div>
                </div>

                <div class="stat-section">
                    <div class="stat-header" onclick="toggleStat('stat2')">
                        <span data-i18n="stat_group_2">2차 스탯 (펼치기)</span>
                        <span id="stat2-icon">▼</span>
                    </div>
                    <div id="stat2" class="stat-content">
                        <div class="stat-item"><label data-i18n="stat_crit_dmg">크리티컬 데미지</label><input type="number" class="stat-in" data-type="second" max="100" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_main_stat">주스탯%</label><input type="number" class="stat-in" data-type="second" max="100" value="0"></div>
                        <div class="stat-item" style="grid-column: span 2;"><label data-i18n="stat_ignore_def">방어력 무시</label><input type="number" class="stat-in" data-type="second" max="100" value="0"></div>
                    </div>
                </div>

                <div class="result-box" style="text-align:center;">
                    <div style="color:var(--text-sub); font-size:0.9rem; margin-bottom:8px;" data-i18n="result_need_point">필요 환생포인트 합계</div>
                    <span id="totalStatPoint" class="display-val">0</span> <span style="color:var(--accent-color); font-weight:bold; font-size:1.5rem;">P</span>
                </div>
            </div>

            <div class="card">
                <h2 data-i18n="card2_title">종합 효율 계산</h2>
                
                <div class="check-group">
                    <label class="check-item"><input type="radio" name="calcMode" value="level" checked onchange="toggleCalcMode()"> 레벨체크</label>
                    <label class="check-item"><input type="radio" name="calcMode" value="minute" onchange="toggleCalcMode()"> 1분체크</label>
                </div>

                <div id="levelModeUI" style="background: rgba(255,255,255,0.03); padding: 18px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border-color);">
                    <label data-i18n="label_measure_range">측정 레벨 구간</label>
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
                        <input type="number" id="measureStart" value="0"> <span style="color:var(--text-sub)">~</span> <input type="number" id="measureEnd" value="0">
                    </div>
                    <label data-i18n="label_measure_time">소요 시간 (분 : 초)</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="number" id="baseMin" placeholder="분"> <span>:</span> <input type="number" id="baseSec" placeholder="초">
                    </div>
                </div>

                <div id="minuteModeUI" class="hidden" style="background: rgba(255,255,255,0.03); padding: 18px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border-color);">
                    <label data-i18n="label_exp_min">1분당 획득 경험치 (단위: M)</label>
                    <input type="number" id="expPerMin" placeholder="예: 500 (500M)">
                </div>

                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="flex:1"><label data-i18n="label_cur_lv">현재 레벨</label><input type="number" id="currentLv" value="0"></div>
                    <div style="flex:1"><label data-i18n="label_tar_lv">목표 레벨</label><input type="number" id="targetLv" value="0"></div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="flex:1"><label data-i18n="label_rem_time">자정까지 남은 시간</label><div style="display:flex; gap:5px;"><input type="number" id="remH" placeholder="H">:<input type="number" id="remM" placeholder="M"></div></div>
                    <div style="flex:1"><label data-i18n="label_rem_rebirth">남은 환생 횟수 (최대 20)</label><input type="number" id="remRebirth" value="0"></div>
                </div>
                <button class="calc-btn" onclick="calTime()" data-i18n="btn_calc_eff">종합 효율 계산하기</button>

                <div class="result-box" id="timeResultBox" style="display:none;">
                    <div class="sub-row"><span data-i18n="result_time_to_tar">목표까지 소요시간</span><span id="resTotalTime" class="sub-val highlight">-</span></div>
                    <div class="sub-row"><span data-i18n="result_point_at_tar">도달 시 환생포인트</span><span id="resTotalPoint" class="sub-val">-</span></div>
                    
                    <div class="recommend-box">
                        <div style="font-size:1rem; color:var(--accent-color); font-weight:700; margin-bottom:12px;" data-i18n="result_best_lv">최고 효율 추천 환생 레벨</div>
                        <div style="font-size:2.2rem; font-weight:900; margin-bottom:15px;" id="recommendLv">-</div>
                        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                            <div class="sub-row"><span data-i18n="result_rem_count">최적 환생 횟수</span><span id="resRemCount" class="sub-val">-</span></div>
                            <div class="sub-row" style="margin-bottom:0;"><span data-i18n="result_total_gain">총 예상 획득 포인트</span><span id="resTotalExpected" class="sub-val highlight" style="font-size:1.1rem;">-</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            ko: {
                nav_title: "밥똥메 계산기", nav_guide: "뉴비 가이드", card1_title: "환생 & 스탯 계산기", card2_title: "종합 효율 계산",
                label_rebirth_lv: "환생 레벨 포인트 확인 (100~300)", btn_start: "시작", btn_stop: "정지", btn_reset: "리셋", btn_apply: "기록 반영",
                stat_group_1: "1차 스탯 (펼치기)", stat_group_2: "2차 스탯 (펼치기)",
                stat_dmg: "데미지", stat_exp: "추가경험치", stat_crit: "크리티컬", stat_meso: "메소획득", stat_drop: "아이템드롭", stat_speed: "자동공속",
                stat_crit_dmg: "크리티컬 데미지", stat_main_stat: "주스탯%", stat_ignore_def: "방어력 무시",
                result_need_point: "필요 환생포인트 합계", label_measure_range: "측정 레벨 구간", label_measure_time: "소요 시간 (분 : 초)",
                label_exp_min: "1분당 획득 경험치 (단위: M)", label_cur_lv: "현재 레벨", label_tar_lv: "목표 레벨", label_rem_time: "자정까지 남은 시간", label_rem_rebirth: "남은 환생 횟수 (최대 20)",
                btn_calc_eff: "종합 효율 계산하기", result_time_to_tar: "목표까지 소요시간", result_point_at_tar: "도달 시 환생포인트",
                result_best_lv: "최고 효율 추천 환생 레벨", result_rem_count: "최적 환생 횟수", result_total_gain: "총 예상 획득 포인트",
                time_hour: "시간 ", time_min: "분 ", time_sec: "초", time_lack: "시간부족", alert_measure: "측정 데이터를 입력해주세요."
            },
            en: {
                nav_title: "BBM Calc", nav_guide: "Newbie Guide", card1_title: "Rebirth & Stat", card2_title: "Efficiency Calc",
                label_rebirth_lv: "Check Point (100-300)", btn_start: "Start", btn_stop: "Stop", btn_reset: "Reset", btn_apply: "Apply",
                stat_group_1: "1st Stats (Expand)", stat_group_2: "2nd Stats (Expand)",
                stat_dmg: "Damage", stat_exp: "Bonus EXP", stat_crit: "Critical", stat_meso: "Meso", stat_drop: "Drop", stat_speed: "Atk Speed",
                stat_crit_dmg: "Crit Damage", stat_main_stat: "Main Stat%", stat_ignore_def: "Ignore Def",
                result_need_point: "Total Points Needed", label_measure_range: "Level Range", label_measure_time: "Time Taken (Min : Sec)",
                label_exp_min: "EXP per Min (M)", label_cur_lv: "Current Lv", label_tar_lv: "Target Lv", label_rem_time: "Time until Midnight", label_rem_rebirth: "Rebirths Left (Max 20)",
                btn_calc_eff: "Calculate Efficiency", result_time_to_tar: "Time to Target", result_point_at_tar: "Point at Target",
                result_best_lv: "Best Recommended Level", result_rem_count: "Best Count", result_total_gain: "Total Expected Points",
                time_hour: "h ", time_min: "m ", time_sec: "s", time_lack: "Lack of Time", alert_measure: "Please enter measure data."
            },
            zh: {
                nav_title: "转生计算器", nav_guide: "新手指南", card1_title: "转生 & 属性", card2_title: "效率计算",
                label_rebirth_lv: "确认点数 (100-300)", btn_start: "开始", btn_stop: "停止", btn_reset: "重置", btn_apply: "记录",
                stat_group_1: "1次属性 (展开)", stat_group_2: "2次属性 (展开)",
                stat_dmg: "伤害", stat_exp: "额外经验", stat_crit: "暴击", stat_meso: "金币", stat_drop: "掉落", stat_speed: "攻速",
                stat_crit_dmg: "暴击伤害", stat_main_stat: "主属性%", stat_ignore_def: "无视防御",
                result_need_point: "所需转生点合计", label_measure_range: "测量区间", label_measure_time: "所需时间 (分 : 秒)",
                label_exp_min: "每分钟经验 (M)", label_cur_lv: "当前等级", label_tar_lv: "目标等级", label_rem_time: "距离午夜时间", label_rem_rebirth: "剩余次数 (最大 20)",
                btn_calc_eff: "综合效率计算", result_time_to_tar: "目标所需时间", result_point_at_tar: "到达时点数",
                result_best_lv: "最高效率推荐等级", result_rem_count: "最佳次数", result_total_gain: "预计总点数",
                time_hour: "时 ", time_min: "分 ", time_sec: "秒", time_lack: "时间不足", alert_measure: "请输入测量数据。"
            },
            tw: {
                nav_title: "轉生計算器", nav_guide: "新手指南", card1_title: "轉生 & 屬性", card2_title: "效率計算",
                label_rebirth_lv: "確認點數 (100-300)", btn_start: "開始", btn_stop: "停止", btn_reset: "重置", btn_apply: "記錄",
                stat_group_1: "1次屬性 (展開)", stat_group_2: "2次屬性 (展開)",
                stat_dmg: "傷害", stat_exp: "額外經驗", stat_crit: "暴擊", stat_meso: "金幣", stat_drop: "掉落", stat_speed: "攻速",
                stat_crit_dmg: "暴擊傷害", stat_main_stat: "主屬性%", stat_ignore_def: "無視防禦",
                result_need_point: "所需轉生點合計", label_measure_range: "測量區間", label_measure_time: "所需時間 (分 : 秒)",
                label_exp_min: "每分鐘經驗 (M)", label_cur_lv: "當前等級", label_tar_lv: "目標等級", label_rem_time: "距離午夜時間", label_rem_遞迴: "剩餘次數 (最大 20)",
                btn_calc_eff: "綜合效率計算", result_time_to_tar: "目標所需時間", result_point_at_tar: "到達時點數",
                result_best_lv: "最高效率推薦等級", result_rem_count: "最佳次數", result_total_gain: "預計總點數",
                time_hour: "時 ", time_min: "分 ", time_sec: "秒", time_lack: "時間不足", alert_measure: "請輸入測量數據。"
            }
        };

        let currentLang = 'ko';

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.lang === lang) btn.classList.add('active');
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if(i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            updateTotalStatPoints();
        }

        function toggleStat(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            const isActive = content.classList.toggle('active');
            icon.innerText = isActive ? '▲' : '▼';
        }

        function toggleCalcMode() {
            const mode = document.querySelector('input[name="calcMode"]:checked').value;
            if (mode === 'level') {

        function calPoint() {
            let v = parseInt(document.getElementById('pointLvInput').value);
            if(v > 300) { v = 300; document.getElementById('pointLvInput').value = 300; }
            document.getElementById('pointDisplay').innerText = (v >= 100) ? pointData[v-100].toLocaleString() + " P" : "0 P";
        }

        const statInputs = document.querySelectorAll('.stat-in');
        statInputs.forEach(input => {
            input.addEventListener('input', (e) => {
                let val = parseInt(e.target.value) || 0;
                const max = parseInt(e.target.getAttribute('max'));
                if (val > max) { val = max; e.target.value = max; }
                if (val < 0) { val = 0; e.target.value = 0; }
                updateTotalStatPoints();
            });
        });

        function updateTotalStatPoints() {
            let total = 0;
            statInputs.forEach(ti => {
                const lv = parseInt(ti.value) || 0;
                const type = ti.dataset.type;
                if (type === 'normal') {
                    total += (lv * (lv + 1)) / 2;
                } else if (type === 'second') {
                    if (lv > 0) {
                        const first = 1000, last = 1000 + (lv - 1) * 100;
                        total += (lv * (first + last)) / 2;
                    }
                }
            });
            document.getElementById('totalStatPoint').innerText = total.toLocaleString();
        }

        let timerId, elapsedSeconds = 0;
        function startTimer() { if (!timerId) timerId = setInterval(() => { elapsedSeconds++; updateStopwatchDisplay(); }, 1000); }
        function stopTimer() { clearInterval(timerId); timerId = null; }
        function resetTimer() { stopTimer(); elapsedSeconds = 0; updateStopwatchDisplay(); }
        function updateStopwatchDisplay() {
            const h = Math.floor(elapsedSeconds / 3600), m = Math.floor((elapsedSeconds % 3600) / 60), s = elapsedSeconds % 60;
            document.getElementById('stopwatchDisplay').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function applyTimeToCalc() {
            document.getElementById('baseMin').value = Math.floor(elapsedSeconds / 60);
            document.getElementById('baseSec').value = elapsedSeconds % 60;
        }

        function calTime() {
            const mode = document.querySelector('input[name="calcMode"]:checked').value;
            const curLv = parseInt(document.getElementById('currentLv').value);
            const tarLv = parseInt(document.getElementById('targetLv').value);
            const remH = parseInt(document.getElementById('remH').value) || 0;
            const remM = parseInt(document.getElementById('remM').value) || 0;
            const remCntInput = parseInt(document.getElementById('remRebirth').value) || 0;
            const remCnt = Math.min(20, remCntInput);

            let dps = 0;

            if (mode === 'level') {
                const mStart = parseInt(document.getElementById('measureStart').value);
                const mEnd = parseInt(document.getElementById('measureEnd').value);
                const min = parseInt(document.getElementById('baseMin').value) || 0;
                const sec = parseInt(document.getElementById('baseSec').value) || 0;
                const totalSec = (min * 60) + sec;
                if (totalSec <= 0 || mStart >= mEnd) return alert(i18n[currentLang].alert_measure);
                
                let baseExp = 0;
                for(let i = mStart; i < mEnd; i++) { if(expTable[i]) baseExp += expTable[i]; }
                dps = baseExp / totalSec;
            } else {
                const expM = parseFloat(document.getElementById('expPerMin').value) || 0;
                if (expM <= 0) return alert("Error");
                dps = (expM * 1000000) / 60;
            }

            document.getElementById('timeResultBox').style.display = 'block';
            let tarExp = 0;
            for(let i = curLv; i < tarLv; i++) { if(expTable[i]) tarExp += expTable[i]; }
            
            document.getElementById('resTotalTime').innerText = formatTime(tarExp / dps);
            document.getElementById('resTotalPoint').innerText = (tarLv >= 100 ? pointData[tarLv-100].toLocaleString() : 0) + " P";

            const availSec = (remH * 3600) + (remM * 60);
            let bestLv = 0, bestCount = 0, maxTotalExpected = 0;

            if(availSec > 0 && remCnt > 0) {
                for(let lv = 100; lv <= 300; lv++) {
                    let reqExp = 0;
                    for(let i = 0; i < lv; i++) { reqExp += expTable[i]; }
                    let timePerRebirth = reqExp / dps;
                    let possibleCount = Math.floor(availSec / timePerRebirth);
                    let actualCount = Math.min(remCnt, possibleCount);
                    
                    if (actualCount > 0) {
                        let totalExpected = pointData[lv-100] * actualCount;
                        if (totalExpected >= maxTotalExpected) {
                            maxTotalExpected = totalExpected;
                            bestLv = lv;
                            bestCount = actualCount;
                        }
                    }
                }
                
                if(maxTotalExpected === 0) {
                    document.getElementById('recommendLv').innerText = i18n[currentLang].time_lack;
                    document.getElementById('resRemCount').innerText = "-";
                    document.getElementById('resTotalExpected').innerText = "-";
                } else {
                    document.getElementById('recommendLv').innerText = bestLv + " Lv";
                    document.getElementById('resRemCount').innerText = bestCount + (currentLang === 'ko' ? " 회" : (currentLang === 'en' ? " Counts" : " 次"));
                    document.getElementById('resTotalExpected').innerText = maxTotalExpected.toLocaleString() + " P";
                }
            } else {
                document.getElementById('recommendLv').innerText = "-";
                document.getElementById('resRemCount').innerText = "-";
                document.getElementById('resTotalExpected').innerText = "-";
            }
        }

        function formatTime(s) {
            if (!isFinite(s) || s < 0) return "Error";
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
            let res = "";
            if (h > 0) res += h + i18n[currentLang].time_hour;
            if (m > 0) res += m + i18n[currentLang].time_min;
            res += sec + i18n[currentLang].time_sec;
            return res;
        }

        changeLanguage('ko');
