<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밥똥메 - 최종 통합 계산기</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            /* 제공된 이미지 기반의 색상 테마 조정 */
            --bg-color: #0c0e10; /* 더 어두운 배경 */
            --card-bg: #141619; /* 카드 배경 */
            --nav-bg: #141619; /* 네비게이션 배경 */
            
            --text-main: #e0e6ed;
            --text-sub: #94a3b8;
            --accent-color: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --border-color: #2d343f;
            --input-bg: #0c0e10; /* 입력창 배경 */
            --stat-bg: #1e2228; /* 스탯 구역 배경 */

            /* 언어 선택 버튼 스타일 */
            --lang-btn-bg: #212529;
            --lang-btn-active: #ffffff;
            --lang-text-active: #000000;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0; /* 네비게이션 때문에 0으로 변경 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- 상단 네비게이션 바 (추가됨) --- */
        .navbar {
            width: 100%;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
        }
        .nav-logo img {
            width: 24px;
            height: 24px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(255,255,255,0.05);
            color: #fff;
        }

        .lang-selector {
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background-color: var(--lang-btn-bg);
            color: var(--text-sub);
            border: 1px solid transparent;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            border-color: var(--border-color);
            color: #fff;
        }
        .lang-btn.active {
            background-color: var(--lang-btn-active);
            color: var(--lang-text-active);
            font-weight: 700;
        }

        /* --- 기존 메인 컨텐츠 (스타일 수정) --- */
        .main-content {
            padding: 40px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 40px; width: 100%; max-width: 1100px; text-align: left; }
        .header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            color: #fff; /* 이미지는 그라데이션이 없으므로 흰색으로 변경 */
        }
        .header p {
            color: var(--text-sub);
            margin: 10px 0 0 0;
            font-size: 1rem;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px; /* 조금 더 각지게 조정 */
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 360px;
            box-sizing: border-box;
        }

        h2 { text-align: left; margin: 0 0 25px 0; font-size: 1.4rem; color: #fff; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 10px; font-weight: 500; color: #fff; font-size: 0.95rem; }

        input {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            box-sizing: border-box;
        }
        input::placeholder { color: #3d4450; }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: var(--stat-bg);
            padding: 20px;
            border-radius: 16px;
            margin-top: 15px;
        }
        .stat-item { display: flex; flex-direction: column; }
        .stat-item label { font-size: 0.8rem; margin-bottom: 6px; color: var(--text-sub); }
        .stat-item input { padding: 10px; font-size: 1rem; border-color: #3d4450; background-color: var(--card-bg); }

        .stopwatch-container {
            margin: 25px 0;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        #stopwatchDisplay { font-size: 2rem; font-family: monospace; color: var(--accent-color); display: block; margin-bottom: 15px; font-weight: 700; }
        .stopwatch-btns { display: flex; gap: 8px; }
        .stopwatch-btns button { flex: 1; padding: 10px; font-size: 0.85rem; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: 600; }

        .result-box {
            margin-top: 15px;
            padding: 25px;
            background-color: var(--input-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .display-val { font-size: 2.5rem; font-weight: 900; color: var(--accent-color); }
        .sub-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; color: var(--text-sub); }
        .sub-val { color: #fff; font-weight: 700; }
        .highlight { color: var(--accent-color); }

        .recommend-detail {
            background: rgba(0, 210, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        button.calc-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0099ff 0%, #00d2ff 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 800;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="nav-logo">
                <span>💩</span>
                <span data-i18n="nav_title">밥똥메 계산기</span>
            </a>
            <div class="nav-links">
        </div>
        <div class="lang-selector">
            <button class="lang-btn active" onclick="changeLanguage('ko')" data-lang="ko">한국어</button>
            <button class="lang-btn" onclick="changeLanguage('en')" data-lang="en">EN</button>
            <button class="lang-btn" onclick="changeLanguage('zh')" data-lang="zh">简体</button>
            <button class="lang-btn" onclick="changeLanguage('tw')" data-lang="tw">繁體</button>
            <button class="lang-btn" onclick="changeLanguage('ja')" data-lang="ja">日本語</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="header">
            <h1 data-i18n="main_title">종합 계산기</h1>
            <p data-i18n="main_sub">환생, 스탯 포인트 및 경험치 효율을 계산합니다.</p>
        </div>

        <div class="container">
            <div class="card">
                <h2 data-i18n="card1_title">환생 & 스탯 계산기</h2>
                
                <div class="input-group">
                    <label data-i18n="label_rebirth_lv">환생 레벨 포인트 확인 (100~300)</label>
                    <input type="number" id="pointLvInput" placeholder="Lv" oninput="calPoint()">
                    <div id="pointDisplay" style="text-align:right; margin-top:8px; color:var(--accent-color); font-weight:bold; font-size:1.1rem;">0 P</div>
                </div>

                <div class="stopwatch-container">
                    <span id="stopwatchDisplay">00:00:00</span>
                    <div class="stopwatch-btns">
                        <button style="background:#22c55e" onclick="startTimer()" data-i18n="btn_start">시작</button>
                        <button style="background:#ef4444" onclick="stopTimer()" data-i18n="btn_stop">정지</button>
                        <button style="background:#64748b" onclick="resetTimer()" data-i18n="btn_reset">리셋</button>
                        <button style="background:var(--accent-color); color:#000" onclick="applyTimeToCalc()" data-i18n="btn_apply">기록 반영</button>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 20px;">
                    <label style="color:#fff; font-size:1.1rem; font-weight:700;" data-i18n="label_stat_calc">⚡ 스탯 포인트 계산기</label>
                    <div class="stat-grid">
                        <div class="stat-item"><label data-i18n="stat_dmg">데미지 (1000)</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_exp">추가경험치 (1000)</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_crit">크리티컬 (100)</label><input type="number" class="stat-in" data-type="normal" max="100" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_meso">메소획득 (1000)</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_drop">아이템드롭 (1000)</label><input type="number" class="stat-in" data-type="normal" max="1000" value="0"></div>
                        <div class="stat-item"><label data-i18n="stat_speed">자동공속 (150)</label><input type="number" class="stat-in" data-type="normal" max="150" value="0"></div>
                        <div class="stat-item" style="grid-column: span 2;">
                            <label style="color:var(--accent-color)" data-i18n="stat_hyper">하이퍼 포인트 (30)</label>
                            <input type="number" class="stat-in" data-type="hyper" max="30" value="0">
                        </div>
                    </div>
                    <div class="result-box" style="text-align:center;">
                        <div style="color:var(--text-sub); font-size:0.9rem; margin-bottom:8px;" data-i18n="result_need_point">필요 환생포인트 합계</div>
                        <span id="totalStatPoint" class="display-val">0</span> <span style="color:var(--accent-color); font-size:1.5rem; font-weight:700;">P</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 data-i18n="card2_title">종합 효율 계산</h2>
                <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border-color);">
                    <label data-i18n="label_measure_range">측정 레벨 구간 설정</label>
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
                        <input type="number" id="measureStart" value="0"> <span style="color:var(--text-sub)">~</span> <input type="number" id="measureEnd" value="0">
                    </div>
                    <label data-i18n="label_measure_time">해당 구간 소요 시간</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="number" id="baseMin" placeholder="분" data-i18n-placeholder="placeholder_min"> <span style="color:var(--text-sub)">:</span> <input type="number" id="baseSec" placeholder="초" data-i18n-placeholder="placeholder_sec">
                    </div>
                </div>

                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <div style="flex:1"><label data-i18n="label_cur_lv">현재 레벨</label><input type="number" id="currentLv" value="0"></div>
                    <div style="flex:1"><label data-i18n="label_tar_lv">목표 레벨</label><input type="number" id="targetLv" value="0"></div>
                </div>

                <div style="display:flex; gap:15px; margin-bottom:25px;">
                    <div style="flex:1"><label data-i18n="label_rem_time">자정까지 남은 시간</label>
                        <div style="display:flex; gap:8px; align-items:center;"><input type="number" id="remH">:<input type="number" id="remM"></div>
                    </div>
                    <div style="flex:1"><label data-i18n="label_rem_rebirth">남은 환생 횟수</label><input type="number" id="remRebirth" value="0"></div>
                </div>

                <button class="calc-btn" onclick="calTime()" data-i18n="btn_calc_eff">종합 효율 계산하기</button>

                <div class="result-box" id="timeResultBox" style="display:none;">
                    <div class="sub-row">
                        <span data-i18n="result_time_to_tar">목표까지 소요시간</span>
                        <span id="resTotalTime" class="sub-val highlight">-</span>
                    </div>
                    <div class="sub-row">
                        <span data-i18n="result_point_at_tar">도달 시 환생포인트</span>
                        <span id="resTotalPoint" class="sub-val">-</span>
                    </div>
                    
                    <div style="margin-top:25px; border-top:1px solid var(--border-color); padding-top:20px;">
                        <div style="font-size:1rem; color:var(--accent-color); font-weight:700; margin-bottom:8px;" data-i18n="result_best_lv">최고 효율 추천 환생 레벨</div>
                        <div style="display:flex; align-items:baseline; gap:10px; margin-bottom: 10px;">
                            <span id="recommendLv" class="display-val" style="font-size:2.5rem;">-</span>
                            <span id="pointPerOnce" style="color:var(--text-sub); font-size:1rem;"></span>
                        </div>
                        
                        <div id="recommendDetailBox" class="recommend-detail">
                            <div class="sub-row">
                                <span data-i18n="result_rem_count">남은 환생 횟수</span>
                                <span id="resRemCount" class="sub-val">-</span>
                            </div>
                            <div class="sub-row" style="margin-bottom:0;">
                                <span data-i18n="result_total_gain">총 예상 획득 포인트</span>
                                <span id="resTotalExpected" class="sub-val highlight" style="font-size:1.2rem;">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // --- 언어 변경 함수 (추가됨) ---
        function changeLanguage(lang) {
            currentLang = lang;
            
            // 버튼 활성화 상태 변경
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.lang === lang) btn.classList.add('active');
            });

            // 일반 텍스트 변경
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if(i18n[lang][key]) el.innerText = i18n[lang][key];
            });

            // Placeholder 변경
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if(i18n[lang][key]) el.placeholder = i18n[lang][key];
            });

            // 기존 결과창들이 열려있다면 재계산하여 언어 반영
            if(document.getElementById('pointLvInput').value) calPoint();
            updateTotalStatPoints();
            if(document.getElementById('timeResultBox').style.display === 'block') calTime();
        }

        const expTable = [0,15,34,57,92,135,372,560,840,1242,1242,1242,1242,1242,1242,1242,1490,2145,2574,3088,3705,4446,5335,6402,7682,9218,11061,13273,15927,19112,19112,19112,19112,19112,19112,22934,27520,33024,39628,47553,51357,55465,59902,64694,69869,75458,81494,88013,95054,102658,110870,119739,129318,139663,150836,162902,175934,190008,205208,221624,221624,221624,221624,221624,221624,238245,256113,275321,295970,318167,342029,367681,395257,424901,456768,488741,522952,559558,598727,640637,685481,733464,784806,839742,898523,961419,1028718,1100728,1177778,1260222,1342136,1429374,1522283,1621231,1726611,1838840,1958364,2085657,2221224,2365603,2365603,2365603,2365603,2365603,2365603,2519367,2683125,2857528,3043267,3241079,3451749,3676112,3915059,4169537,4440556,4729192,5036589,5363967,5712624,6083944,6479400,6900561,7349097,7826788,8335529,8877338,9454364,10068897,10723375,11420394,12162719,12953295,13795259,14691950,15646926,16663976,17747134,18900697,20129242,21437642,22777494,24201087,25713654,27320757,29028304,30842573,32770233,34818372,36994520,39306677,41763344,44373553,47146900,50093581,53224429,56550955,60085389,63840725,67830770,72070193,76574580,81360491,86445521,91848366,97588888,103688193,110168705,117054249,124370139,132143272,138750435,145687956,152972353,160620970,168652018,177084618,185938848,195235790,204997579,215247457,226009829,237310320,249175836,261634627,274716358,288452175,302874783,318018522,333919448,350615420,368146191,386553500,405881175,426175233,447483994,469858193,493351102,518018657,543919589,571115568,2207026470,2471869646,2768494003,3100713283,3472798876,3889534741,4356278909,4879032378,5464516263,6120258214,7956335678,8831532602,9803001188,10881331318,12078277762,15701761090,17114919588,18655262350,20334235961,22164317197,28813612356,30830565220,32988704785,35297914119,37768768107,49099398539,52536356436,56213901386,60148874483,64359295696,83667084404,86177096936,88762409844,91425282139,94168040603,122418452783,126091006366,129873736         // --- 기존 기능 로직 (일부 텍스트 출력 포맷만 다국어 대응 수정) ---

        function calPoint() {
            let v = parseInt(document.getElementById('pointLvInput').value);
            if(v > 300) { v = 300; document.getElementById('pointLvInput').value = 300; }
            document.getElementById('pointDisplay').innerText = (v >= 100) ? pointData[v-100].toLocaleString() + " P" : "0 P";
        }

        const statInputs = document.querySelectorAll('.stat-in');
        statInputs.forEach(input => {
            input.addEventListener('input', (e) => {
                let val = parseInt(e.target.value) || 0;
                const max = parseInt(e.target.getAttribute('max'));
                if (val > max) { val = max; e.target.value = max; }
                if (val < 0) { val = 0; e.target.value = 0; }
                updateTotalStatPoints();
            });
        });

        function updateTotalStatPoints() {
            let total = 0;
            statInputs.forEach(ti => {
                const lv = parseInt(ti.value) || 0;
                if (ti.dataset.type === 'normal') {
                    total += (lv * (lv + 1)) / 2;
                } else if (ti.dataset.type === 'hyper') {
                    if (lv > 0) {
                        const first = 100, last = 100 + (lv - 1) * 10;
                        total += (lv * (first + last)) / 2;
                    }
                }
            });
            document.getElementById('totalStatPoint').innerText = total.toLocaleString();
        }

        let timerId, elapsedSeconds = 0;
        function startTimer() { if (!timerId) timerId = setInterval(() => { elapsedSeconds++; updateStopwatchDisplay(); }, 1000); }
        function stopTimer() { clearInterval(timerId); timerId = null; }
        function resetTimer() { stopTimer(); elapsedSeconds = 0; updateStopwatchDisplay(); }
        function updateStopwatchDisplay() {
            const h = Math.floor(elapsedSeconds / 3600), m = Math.floor((elapsedSeconds % 3600) / 60), s = elapsedSeconds % 60;
            document.getElementById('stopwatchDisplay').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function applyTimeToCalc() {
            document.getElementById('baseMin').value = Math.floor(elapsedSeconds / 60);
            document.getElementById('baseSec').value = elapsedSeconds % 60;
        }

        function calTime() {
            const mStart = parseInt(document.getElementById('measureStart').value);
            const mEnd = parseInt(document.getElementById('measureEnd').value);
            const min = parseInt(document.getElementById('baseMin').value) || 0;
            const sec = parseInt(document.getElementById('baseSec').value) || 0;
            const curLv = parseInt(document.getElementById('currentLv').value);
            const tarLv = parseInt(document.getElementById('targetLv').value);
            const remH = parseInt(document.getElementById('remH').value) || 0;
            const remM = parseInt(document.getElementById('remM').value) || 0;
            const remCnt = parseInt(document.getElementById('remRebirth').value) || 0;

            const totalSec = (min * 60) + sec;
            // 알림 텍스트 다국어화
            if (totalSec <= 0 || mStart >= mEnd) return alert(i18n[currentLang].alert_measure);

            let baseExp = 0;
            for(let i = mStart; i < mEnd; i++) { if(expTable[i]) baseExp += expTable[i]; }
            const dps = baseExp / totalSec;

            document.getElementById('timeResultBox').style.display = 'block';
            
            let tarExp = 0;
            for(let i = curLv; i < tarLv; i++) { if(expTable[i]) tarExp += expTable[i]; }
            document.getElementById('resTotalTime').innerText = formatTime(tarExp / dps);
            document.getElementById('resTotalPoint').innerText = (tarLv >= 100 ? pointData[tarLv-100].toLocaleString() : 0) + " P";

            const availSec = (remH * 3600) + (remM * 60);
            if(availSec > 0 && remCnt > 0) {
                let bestLv = 100, maxPts = -1;
                for(let lv = 100; lv <= 300; lv++) {
                    let reqExp = 0;
                    for(let i = 0; i < lv; i++) { reqExp += expTable[i]; }
                    if ((reqExp / dps) * remCnt <= availSec) {
                        if(pointData[lv-100] > maxPts) { maxPts = pointData[lv-100]; bestLv = lv; }
                    }
                }
                
                if(maxPts === -1) {
                    // 시간 부족 텍스트 다국어화
                    document.getElementById('recommendLv').innerText = i18n[currentLang].time_lack;
                    document.getElementById('pointPerOnce').innerText = "";
                    document.getElementById('resRemCount').innerText = "-";
                    document.getElementById('resTotalExpected').innerText = "-";
                } else {
                    document.getElementById('recommendLv').innerText = bestLv + " Lv";
                    // 회당 포인트 포맷 다국어화
                    document.getElementById('pointPerOnce').innerText = `${i18n[currentLang].once_prefix}${maxPts.toLocaleString()}${i18n[currentLang].once_suffix}`;
                    // 회(count) 텍스트는 숫자만 표기하거나 ko에서만 '회' 붙임 (간단하게 숫자만 표기)
                    document.getElementById('resRemCount').innerText = remCnt; 
                    document.getElementById('resTotalExpected').innerText = (maxPts * remCnt).toLocaleString() + " P";
                }
            } else {
                document.getElementById('recommendLv').innerText = "-";
                document.getElementById('pointPerOnce').innerText = "";
                document.getElementById('resRemCount').innerText = "-";
                document.getElementById('resTotalExpected').innerText = "-";
            }
        }

        // 시간 포맷 함수 다국어 대응 수정
        function formatTime(s) {
            if (!isFinite(s) || s < 0) return i18n[currentLang].time_fail;
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
            let res = "";
            if (h > 0) res += h + i18n[currentLang].time_hour;
            if (m > 0) res += m + i18n[currentLang].time_min;
            res += sec + i18n[currentLang].time_sec;
            return res;
        }

        changeLanguage('ko');
